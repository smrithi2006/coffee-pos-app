<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew & Bean - POS System</title>
    <style>
        :root {
            --primary: #6F4E37;
            --primary-dark: #4A3322;
            --accent: #D4A373;
            --bg: #F4F1EA;
            --surface: #FFFFFF;
            --text: #2C221E;
            --text-light: #7A6E65;
            --border: #E3DCD2;
            --success: #38A169;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout */
        .sidebar {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .cart-panel {
            width: 420px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 15px rgba(0,0,0,0.03);
        }

        /* Branding */
        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--text-light);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-links a.active, .nav-links a:hover {
            background: var(--bg);
            color: var(--primary);
        }

        /* Header & Search */
        header {
            padding: 20px 32px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-bar {
            position: relative;
            width: 320px;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            font-size: 0.9rem;
            outline: none;
        }

        .search-bar svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        /* Catalog Grid */
        .catalog-container {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .categories {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .cat-btn {
            padding: 8px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-light);
            transition: all 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            border-color: var(--accent);
        }

        .card-img {
            height: 110px;
            background: var(--bg);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .card h4 {
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .card .price {
            color: var(--primary);
            font-weight: 700;
            font-size: 0.95rem;
        }

        /* Cart Panel */
        .cart-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--border);
        }

        .cart-item-details h5 {
            font-size: 0.9rem;
            margin-bottom: 2px;
        }

        .cart-item-details span {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            width: 26px;
            height: 26px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover {
            background: var(--border);
        }

        /* Cart Summary & Checkout */
        .cart-summary {
            padding: 24px;
            border-top: 1px solid var(--border);
            background: var(--bg);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .summary-row.total {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
            border-top: 1px solid var(--border);
            padding-top: 12px;
            margin-top: 8px;
        }

        .checkout-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 16px;
            transition: background 0.2s;
        }

        .checkout-btn:hover {
            background: var(--primary-dark);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: var(--surface);
            width: 400px;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .receipt-box {
            background: #fffdf9;
            border: 1px dashed var(--border);
            padding: 20px;
            text-align: left;
            font-family: monospace;
            font-size: 0.85rem;
            margin: 20px 0;
            max-height: 250px;
            overflow-y: auto;
        }

        .modal-btn {
            width: 100%;
            padding: 12px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="logo">
            ☕ Brew & Bean POS
        </div>
        <ul class="nav-links">
            <li><a href="#" class="active">Point of Sale</a></li>
            <li><a href="#" onclick="alert('Order History view coming soon!')">Orders</a></li>
            <li><a href="#" onclick="alert('Inventory view coming soon!')">Inventory</a></li>
            <li><a href="#" onclick="alert('Settings view coming soon!')">Settings</a></li>
        </ul>
    </aside>

    <!-- Main Catalog View -->
    <main class="main-content">
        <header>
            <div class="search-bar">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <input type="text" id="searchInput" placeholder="Search coffee, bakery, snacks..." oninput="filterCatalog()">
            </div>
            <div style="font-weight: 500; color: var(--text-light);">Register #01 • Cashier: Amrutha</div>
        </header>

        <div class="catalog-container">
            <div class="categories">
                <button class="cat-btn active" onclick="setCategory('all', this)">All Items</button>
                <button class="cat-btn" onclick="setCategory('coffee', this)">Coffee</button>
                <button class="cat-btn" onclick="setCategory('bakery', this)">Bakery</button>
                <button class="cat-btn" onclick="setCategory('cold', this)">Cold Drinks</button>
            </div>

            <div class="grid" id="catalogGrid">
                <!-- Dynamically populated -->
            </div>
        </div>
    </main>

    <!-- Cart & Checkout Panel -->
    <section class="cart-panel">
        <div class="cart-header">
            <h3>Current Order</h3>
            <button onclick="clearCart()" style="background: none; border: none; color: #E53E3E; cursor: pointer; font-size: 0.85rem; font-weight: 600;">Clear All</button>
        </div>

        <div class="cart-items" id="cartItemsContainer">
            <div style="color: var(--text-light); text-align: center; margin-top: 40px;">Cart is empty</div>
        </div>

        <div class="cart-summary">
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotalVal">₹0.00</span>
            </div>
            <div class="summary-row">
                <span>GST (5%)</span>
                <span id="taxVal">₹0.00</span>
            </div>
            <div class="summary-row total">
                <span>Total Due</span>
                <span id="totalVal">₹0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </section>

    <!-- Success / Receipt Modal -->
    <div class="modal-overlay" id="receiptModal">
        <div class="modal">
            <h2>Payment Successful!</h2>
            <div class="receipt-box" id="receiptContent"></div>
            <button class="modal-btn" onclick="closeModal()">New Order</button>
        </div>
    </div>

    <script>
        const catalog = [
            { id: 1, name: "Espresso", price: 120, category: "coffee", icon: "☕" },
            { id: 2, name: "Americano", price: 150, category: "coffee", icon: "☕" },
            { id: 3, name: "Cappuccino", price: 180, category: "coffee", icon: "🥛" },
            { id: 4, name: "Cafe Latte", price: 190, category: "coffee", icon: "☕" },
            { id: 5, name: "Cold Brew", price: 210, category: "cold", icon: "🧊" },
            { id: 6, name: "Mocha", price: 220, category: "coffee", icon: "🍫" },
            { id: 7, name: "Croissant", price: 140, category: "bakery", icon: "🥐" },
            { id: 8, name: "Blueberry Muffin", price: 160, category: "bakery", icon: "🧁" }
        ];

        let cart = {};
        let currentCategory = 'all';

        function renderCatalog(items = catalog) {
            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = items.map(item => `
                <div class="card" onclick="addToCart(${item.id})">
                    <div class="card-img">${item.icon}</div>
                    <div>
                        <h4>${item.name}</h4>
                        <div class="price">₹${item.price.toFixed(2)}</div>
                    </div>
                </div>
            `).join('');
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterCatalog();
        }

        function filterCatalog() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = catalog.filter(item => {
                const matchesCat = currentCategory === 'all' || item.category === currentCategory;
                const matchesSearch = item.name.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });
            renderCatalog(filtered);
        }

        function addToCart(id) {
            if (cart[id]) {
                cart[id].qty++;
            } else {
                const item = catalog.find(i => i.id === id);
                cart[id] = { ...item, qty: 1 };
            }
            renderCart();
        }

        function updateQty(id, change) {
            if (cart[id]) {
                cart[id].qty += change;
                if (cart[id].qty <= 0) delete cart[id];
            }
            renderCart();
        }

        function clearCart() {
            cart = {};
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cartItemsContainer');
            const keys = Object.keys(cart);

            if (keys.length === 0) {
                container.innerHTML = '<div style="color: var(--text-light); text-align: center; margin-top: 40px;">Cart is empty</div>';
                document.getElementById('subtotalVal').innerText = '₹0.00';
                document.getElementById('taxVal').innerText = '₹0.00';
                document.getElementById('totalVal').innerText = '₹0.00';
                return;
            }

            let subtotal = 0;
            container.innerHTML = keys.map(id => {
                const item = cart[id];
                subtotal += item.price * item.qty;
                return `
                    <div class="cart-item">
                        <div class="cart-item-details">
                            <h5>${item.name}</h5>
                            <span>₹${item.price} x ${item.qty}</span>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQty(${id}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="updateQty(${id}, 1)">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            const tax = subtotal * 0.05;
            const total = subtotal + tax;

            document.getElementById('subtotalVal').innerText = `₹${subtotal.toFixed(2)}`;
            document.getElementById('taxVal').innerText = `₹${tax.toFixed(2)}`;
            document.getElementById('totalVal').innerText = `₹${total.toFixed(2)}`;
        }

        function checkout() {
            if (Object.keys(cart).length === 0) {
                alert('Cart is empty!');
                return;
            }

            let subtotal = 0;
            let receiptHTML = `<strong>BREW & BEAN CAFE</strong><br>`;
            receiptHTML += `Date: ${new Date().toLocaleString()}<br>`;
            receiptHTML += `--------------------------------<br>`;
            
            Object.values(cart).forEach(item => {
                let lineTotal = item.price * item.qty;
                subtotal += lineTotal;
                receiptHTML += `${item.name} x${item.qty} : ₹${lineTotal.toFixed(2)}<br>`;
            });

            const tax = subtotal * 0.05;
            const total = subtotal + tax;

            receiptHTML += `--------------------------------<br>`;
            receiptHTML += `Subtotal: ₹${subtotal.toFixed(2)}<br>`;
            receiptHTML += `GST (5%): ₹${tax.toFixed(2)}<br>`;
            receiptHTML += `<strong>TOTAL: ₹${total.toFixed(2)}</strong><br>`;
            receiptHTML += `--------------------------------<br>`;
            receiptHTML += `Thank you for visiting!`;

            document.getElementById('receiptContent').innerHTML = receiptHTML;
            document.getElementById('receiptModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('receiptModal').style.display = 'none';
            clearCart();
        }

        // Initialize view
        renderCatalog();
    </script>
</body>
</html>
